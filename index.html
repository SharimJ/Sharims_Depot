<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sharim’s Depot · Portfolio</title>
<!-- Clash Display + Cabinet Grotesk come from Fontshare; Google fallbacks are loaded too. -->
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=cabinet-grotesk@400,500,700,800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Outfit:wght@600;700&family=DM+Sans:wght@400;500;700;800&display=swap">
<style>
@property --w{syntax:'<length>';inherits:true;initial-value:200px}
@property --h{syntax:'<length>';inherits:true;initial-value:86px}
@property --d{syntax:'<length>';inherits:true;initial-value:80px}
@property --span{syntax:'<length>';inherits:true;initial-value:200px}
@property --fh{syntax:'<length>';inherits:true;initial-value:60px}
:root{--disp:'Clash Display','Outfit','Arial Black',sans-serif;--body:'Cabinet Grotesk','DM Sans',system-ui,sans-serif;--serif:'Instrument Serif',Georgia,serif;--ease:cubic-bezier(.55,0,.25,1);--lf:.28;--wf:.026;--px:48px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:flex;flex-direction:column;min-height:100svh;overflow-x:hidden;font-family:var(--body);color:#fff;background:linear-gradient(#0f74e0,#1f93f2 55%,#46b8ff) no-repeat;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
nav{position:relative;z-index:20;min-height:72px;padding:0 var(--px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;grid-template-areas:"l n t"}
.logo{grid-area:l;width:112px;display:block;filter:invert(1);mix-blend-mode:screen}
.links{grid-area:n;display:flex;gap:6px}
.links button{font-weight:800;font-size:15px;color:#e6f3ff;padding:8px 14px;border-radius:99px;transition:background .2s}
.links button:hover,.links button:focus-visible{background:rgba(255,255,255,.18);outline:0}
.talk{grid-area:t;justify-self:end;font:600 15px var(--disp);color:#fff;text-decoration:none}
.talk:hover{text-decoration:underline}
#stage{position:relative;flex:1;min-height:560px;overflow:hidden;perspective:1700px;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:44px 44px;--dur:0ms}
.depot{position:absolute;left:var(--px);top:44px;font-size:11px;letter-spacing:.2em;color:#d7ecff;font-weight:700}
.depot b{color:#ffd23f}
.word{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font:700 clamp(90px,19vw,330px)/1 var(--disp);letter-spacing:-.04em;color:#fff;white-space:nowrap;user-select:none}
.pill{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:950;padding:9px 18px;border-radius:99px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;font-weight:800;letter-spacing:.18em;pointer-events:none}
/* claw */
#claw{position:absolute;inset:0;z-index:900;pointer-events:none;--cx:0px;--cy:62px;--rs:.3;transition:--span var(--dur) var(--ease),--fh var(--dur) var(--ease)}
.rail{position:absolute;left:0;right:0;top:14px;height:16px;border-radius:8px;background:linear-gradient(#fff,#c9d3df);box-shadow:0 6px 16px rgba(10,60,170,.4)}
.rail::after{content:"";position:absolute;left:10px;right:10px;top:7px;border-top:1px dashed rgba(70,90,120,.45)}
.car{position:absolute;top:5px;left:0;width:68px;height:34px;border-radius:11px;background:linear-gradient(#fff,#dbe3ec);box-shadow:0 4px 10px rgba(10,50,150,.35);transform:translateX(calc(var(--cx) - 34px));transition:transform var(--dur) var(--ease)}
.car::before,.car::after{content:"";position:absolute;top:7px;width:8px;height:8px;border-radius:50%;background:#8a96a6}
.car::before{left:12px}.car::after{right:12px}
.rod{position:absolute;top:40px;left:-3px;width:6px;height:100px;transform-origin:top;background:linear-gradient(90deg,#8f9aa8,#fff,#8f9aa8);transform:translateX(var(--cx)) scaleY(var(--rs));transition:transform var(--dur) var(--ease)}
.grip{position:absolute;left:0;top:0;transform:translate(var(--cx),var(--cy));transition:transform var(--dur) var(--ease)}
.head{position:absolute;left:-36px;top:0;width:72px;height:34px;border-radius:12px;background:linear-gradient(#fff,#d9e1ea);box-shadow:0 5px 12px rgba(10,50,150,.35);z-index:2}
.fg{position:absolute;top:22px;width:calc(var(--span)/2);height:11px;border-radius:5px;background:linear-gradient(#fff,#d9e1ea);transition:transform var(--dur) var(--ease)}
.fg::after{content:"";position:absolute;top:0;width:13px;height:var(--fh);border-radius:5px 5px 7px 7px;background:linear-gradient(90deg,#d9e1ea,#fff,#d9e1ea);box-shadow:0 4px 8px rgba(10,50,150,.3)}
.fl{right:0;transform-origin:100% 0}.fl::after{left:0}
.fr{left:0;transform-origin:0 0}.fr::after{right:0}
.op .fl{transform:rotate(16deg)}.op .fr{transform:rotate(-16deg)}
.op .fg{transition-timing-function:cubic-bezier(.34,1.56,.64,1)}
/* containers */
.box{--rib:repeating-linear-gradient(90deg,rgba(255,255,255,.13) 0 3px,rgba(0,0,0,.15) 3px 6px);position:absolute;left:0;top:0;width:var(--w);height:var(--h);transform-style:preserve-3d;translate:0 0;transition:transform var(--dur) var(--ease),--w var(--dur) var(--ease),--h var(--dur) var(--ease),--d var(--dur) var(--ease),translate .2s}
.box:not(.held):hover,.box:has(.hit:focus-visible){translate:0 -10px}
.fc{position:absolute;inset:0;background:var(--rib),var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);backface-visibility:hidden}
.back{transform:rotateY(180deg) translateZ(calc(var(--d)/2))}
.end{inset:auto;top:0;height:100%;width:var(--d);left:calc((var(--w) - var(--d))/2);background:linear-gradient(90deg,transparent calc(50% - 1px),rgba(0,0,0,.35) calc(50% - 1px) calc(50% + 1px),transparent 0),var(--rib),var(--k)}
.er{transform:rotateY(90deg) translateZ(calc(var(--w)/2))}
.el{transform:rotateY(-90deg) translateZ(calc(var(--w)/2))}
.tp,.bt{inset:auto;left:0;width:100%;height:var(--d);top:calc((var(--h) - var(--d))/2)}
.tp{transform:rotateX(90deg) translateZ(calc(var(--h)/2))}
.bt{transform:rotateX(-90deg) translateZ(calc(var(--h)/2))}
.front{background:none;box-shadow:none;backface-visibility:visible;transform:translateZ(calc(var(--d)/2));transform-style:preserve-3d}
.wall{position:absolute;inset:0;transform:translateZ(-3px);background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 3px,transparent 3px 6px),#0c1a4d;display:grid;place-items:center;overflow:hidden;font-size:calc(var(--w)*var(--wf))}
.in{width:80%;opacity:0;transition:opacity .3s;color:#dfe8fb;font-size:1em;line-height:1.45}
.open .in{opacity:1;transition:opacity .5s .4s}
.kick{font-weight:800;font-size:.8em;letter-spacing:.16em;text-transform:uppercase;color:var(--a)}
h2{font:700 2.3em/1 var(--disp);color:#fff;margin:.25em 0 .4em;outline:0}
h2 em{font:italic 400 1.2em/.9 var(--serif);color:var(--a)}
.in ul{list-style:none;padding:0;display:grid;gap:.35em}
.in li b{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:.5em}
.chips span{padding:.3em .85em;border-radius:99px;border:1px solid var(--a);color:#fff;font-weight:700}
.cta{display:inline-block;margin-top:.8em;padding:.5em 1.1em;border-radius:99px;background:var(--a);color:#0b1745;font-weight:800;text-decoration:none}
.dr{position:absolute;top:0;height:100%;width:50%;transform-style:preserve-3d;transform:translateZ(1px);transition:transform .45s var(--ease)}
.dl{left:0;transform-origin:0 50%}.dd{left:50%;transform-origin:100% 50%}
.open .dl{transform:translateZ(1px) rotateY(-122deg);transition:transform .75s cubic-bezier(.34,1.45,.5,1)}
.open .dd{transform:translateZ(1px) rotateY(122deg);transition:transform .75s cubic-bezier(.34,1.45,.5,1)}
.o,.i{position:absolute;inset:0;backface-visibility:hidden}
.o{overflow:hidden;background:var(--rib),var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.dl .o{box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),inset -3px 0 0 rgba(0,0,0,.35)}
.dd .o{box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),inset 3px 0 0 rgba(0,0,0,.35);--off:calc(var(--w)/2)}
.i{transform:rotateY(180deg);background:var(--rib),var(--k)}
.lb{position:absolute;top:7%;left:calc(var(--w)*.05 - var(--off,0px));width:max-content;font:700 calc(var(--h)*var(--lf))/.84 var(--disp);text-transform:uppercase;color:#fff}
.tg{position:absolute;right:7%;bottom:7%;font-weight:800;font-size:max(8px,calc(var(--h)*.07));letter-spacing:.2em;color:#fff}
.hit{position:absolute;inset:0;transform:translateZ(3px)}
.hit:focus-visible{outline:3px solid #ffd23f;outline-offset:-7px}
.open .hit{display:none}
@media(max-width:700px){
:root{--px:14px;--lf:.25;--wf:.034}
nav{padding:8px var(--px);grid-template-columns:1fr auto;grid-template-areas:"l t" "n n";row-gap:2px}
.logo{width:92px}
.links{justify-content:center;gap:2px}
.links button{padding:6px 10px}
.depot,.pill{display:none}
.word{font-size:clamp(60px,17vw,330px)}
#stage{min-height:600px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<nav>
<!-- Placeholder logo. To use your own logo.png (black on white): <img class="logo" src="logo.png" alt="Sharim"> -->
<img class="logo" alt="Sharim" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 224 80'%3E%3Crect width='224' height='80' fill='%23fff'/%3E%3Ctext x='112' y='58' text-anchor='middle' font-family='Arial Rounded MT Bold,Nunito,Arial' font-weight='900' font-size='54' fill='%23000' stroke='%23000' stroke-width='3' stroke-linejoin='round'%3Esharim%3C/text%3E%3C/svg%3E">
<div class="links"><button data-i="1">Work</button><button data-i="2">About</button><button data-i="3">Process</button><button data-i="6">Contact</button></div>
<!-- WhatsApp: replace 923000000000 with your number, country code first, digits only (no + or spaces) -->
<a class="talk" href="https://wa.me/923303854985" target="_blank" rel="noopener">Let’s Talk ↗</a>
</nav>
<main id="stage">
<p class="depot">SHARIM’S DEPOT · <b>7 CONTAINERS</b> · 2026</p>
<div class="word" aria-hidden="true">PORTFOLIO</div>
<div id="boxes"></div>
<div id="claw" aria-hidden="true"><div class="rail"></div><div class="car"></div><div class="rod"></div><div class="grip"><div class="head"></div><div class="fg fl"></div><div class="fg fr"></div></div></div>
<div class="pill" aria-hidden="true">PICK A CONTAINER ↓</div>
</main>
<script>
const D=[
{l:'PORT<br>FOLIO',t:'SHARIM',c:'#e5322d',k:'#a91f1b',a:'#ff6a62',n:'Portfolio',kk:'01 — Hello',h:'Hi, I’m <em>Sharim</em>.',b:'<p>An aspiring student, creative developer and designer passionate about technology, creativity and building ideas into reality.</p>'},
{l:'THE<br>WORK',t:'02',c:'#f26a1f',k:'#b84a10',a:'#ff8f4d',n:'Selected work',kk:'02 — The work',h:'What I’ve <em>built</em>.',b:'<ul><li><b>Meer&amp;Co</b> — Website Build</li><li><b>KaffBeans</b> — Branding &amp; Design</li><li><b>Orbit-X</b> — NASA Space Apps Project</li></ul>'},
{l:'ABOUT<br>ME',t:'03',c:'#1d55d8',k:'#123a9c',a:'#7fa6ff',n:'About me',kk:'03 — About me',h:'A little about <em>me</em>.',b:'<p>An A-Level student, exploring engineering, technology, entrepreneurship and creative design. Always learning, experimenting and building.</p>'},
{l:'PRO<br>CESS',t:'04',c:'#f6b919',k:'#c08a0a',a:'#ffd23f',n:'Process',kk:'04 — Process',h:'How I <em>work</em>.',b:'<ul><li><b>01 Discover</b> — Understand the idea.</li><li><b>02 Plan</b> — Shape the vision.</li><li><b>03 Create</b> — Bring it to life.</li><li><b>04 Improve</b> — Refine every detail.</li></ul>'},
{l:'TOOL<br>KIT',t:'05',c:'#97a1ad',k:'#6c7682',a:'#c5cdd7',n:'Toolkit',kk:'05 — Toolkit',h:'Tools of my <em>trade</em>.',b:'<div class="chips"><span>Canva</span><span>HTML</span><span>CSS</span><span>JavaScript</span><span>Python</span><span>GitHub</span><span>Netlify</span></div>'},
{l:'WHAT<br>I DO',t:'06',c:'#e5322d',k:'#a91f1b',a:'#ff6a62',n:'What I do',kk:'06 — What I do',h:'What I <em>bring</em>.',b:'<div class="chips"><span>Graphic Design</span><span>Web Development</span><span>Brand Identity</span><span>Creative Problem Solving</span></div>'},
{l:'SAY<br>HELLO',t:'07',c:'#2546b8',k:'#172f80',a:'#93aaff',n:'Say hello',kk:'07 — Say hello',h:'Let’s <em>connect</em>.',b:'<p>Got an interesting idea, project or collaboration in mind? Let’s connect and create something meaningful.</p><a class="cta" href="mailto:sharimjunaid668@gmail.com" target="_top">sharimjunaid668@gmail.com ↗</a>'}];
const P=[[.48,.66,-14,-24,6],[.13,.86,-16,28,16],[.36,.90,-12,-20,-10],[.60,.88,-14,24,12],[.86,.86,-16,-30,-14],[.25,.68,-14,30,-12],[.73,.68,-14,-26,16]];
const M=[[.50,.64],[.17,.91],[.50,.93],[.84,.90],[.20,.77],[.52,.79],[.82,.76]];
const stage=document.getElementById('stage'),claw=document.getElementById('claw'),RM=matchMedia('(prefers-reduced-motion:reduce)');
document.getElementById('boxes').innerHTML=D.map((d,i)=>`<div class="box" data-i="${i}" style="--c:${d.c};--k:${d.k};--a:${d.a}"><div class="fc back"></div><div class="fc end el"></div><div class="fc end er"></div><div class="fc tp"></div><div class="fc bt"></div><div class="fc front"><div class="wall" inert><div class="in"><div class="kick">${d.kk}</div><h2 tabindex="-1">${d.h}</h2>${d.b}</div></div><div class="dr dl"><div class="o"><span class="lb">${d.l}</span></div><div class="i"></div></div><div class="dr dd"><div class="o"><span class="lb">${d.l}</span><span class="tg">${d.t}</span></div><div class="i"></div></div><button class="hit" aria-label="Open the ${d.n} container"></button></div></div>`).join('');
const boxes=[...document.querySelectorAll('.box')];
let S,C,cur=-1,busy=false,queued=null;
const sl=ms=>new Promise(r=>setTimeout(r,RM.matches?0:ms));
function lay(){const w=stage.clientWidth,h=stage.clientHeight,ph=w<=700,W=ph?Math.min(170,w*.38):Math.max(200,Math.min(310,w*.2));S={w,h,ph,W,H:W*(ph?.6:.43),D:W*(ph?.56:.4),f:ph?2.4:1.95}}
function geo(i,held){const k=held?S.f:1,W=S.W*k,H=S.H*k,D=S.D*k;if(held)return{x:S.w/2,y:92+H/2,W,H,D,r:[-7,-11,0]};const p=S.ph?M[i]:P[i];return{x:p[0]*S.w,y:p[1]*S.h,W,H,D,r:P[i].slice(2)}}
function put(i,held){const g=geo(i,held),e=boxes[i],s=e.style;s.setProperty('--w',g.W+'px');s.setProperty('--h',g.H+'px');s.setProperty('--d',g.D+'px');s.transform=`translate(${g.x}px,${g.y}px) translate(-50%,-50%) rotateX(${g.r[0]}deg) rotateY(${g.r[1]}deg) rotateZ(${g.r[2]}deg)`;return g}
const pz=i=>Math.round((S.ph?M[i][1]:P[i][1])*100);
const gy=g=>g.y-g.H/2-30;
function setClaw(x,y,span,fh,open){C={x,y,span,fh,open};const s=claw.style;s.setProperty('--cx',x+'px');s.setProperty('--cy',y+'px');s.setProperty('--rs',(y-40)/100);s.setProperty('--span',span+'px');s.setProperty('--fh',fh+'px');claw.classList.toggle('op',open)}
const T=async(ms,f)=>{if(RM.matches)ms=0;stage.style.setProperty('--dur',ms+'ms');f();await sl(ms)};
function openDoors(i,on){const e=boxes[i];e.classList.toggle('open',on);e.querySelector('.wall').inert=!on}
async function drop(){
 const i=cur,e=boxes[i];openDoors(i,false);await sl(450);
 const g=geo(i,false),y=gy(g);
 await T(850,()=>{put(i,false);setClaw(g.x,y,1.06*g.W,.55*g.H,false)});
 e.classList.remove('held');e.style.zIndex=pz(i);
 await T(300,()=>setClaw(g.x,y,1.06*g.W,.55*g.H,true));
 cur=-1}
async function pick(i){
 if(cur>=0)await drop();
 const e=boxes[i],g=geo(i,false),span=1.06*g.W,fh=.55*g.H;
 await T(750,()=>setClaw(g.x,62,span,fh,true));
 await T(560,()=>setClaw(g.x,gy(g),span,fh,true));
 await T(240,()=>setClaw(g.x,gy(g),span,fh,false));
 e.classList.add('held');e.style.zIndex=800;
 const h=geo(i,true);
 await T(950,()=>{put(i,true);setClaw(h.x,gy(h),1.06*h.W,.55*h.H,false)});
 openDoors(i,true);cur=i;await sl(750);
 e.querySelector('h2').focus({preventScroll:true})}
async function go(i){
 if(busy){queued=i;return}
 busy=true;
 try{let t=i;while(t!=null){queued=null;if(t!==cur)await pick(t);else boxes[t].querySelector('h2').focus({preventScroll:true});t=queued}}finally{busy=false}}
function place(){
 lay();stage.style.setProperty('--dur','0ms');
 boxes.forEach((e,i)=>{put(i,i===cur);if(i!==cur)e.style.zIndex=pz(i)});
 if(cur>=0){const g=geo(cur,true);setClaw(g.x,gy(g),1.06*g.W,.55*g.H,false)}
 else{const g=geo(0,false);setClaw(S.w/2,62,1.06*g.W,.55*g.H,true)}}
boxes.forEach((e,i)=>e.querySelector('.hit').addEventListener('click',()=>go(i)));
document.querySelectorAll('.links button').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.i)));
addEventListener('keydown',e=>{if(e.key==='Escape')go(0)});
addEventListener('resize',()=>{if(!busy)place()});
place();
setTimeout(()=>go(0),500);
</script>
</body>
</html>
